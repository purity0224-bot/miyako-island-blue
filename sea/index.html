<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宮古島・親子海上活動</title>
<style>
:root{
    /* 水墨畫意版統一色票（2026-07-05 接入）：宣紙暖底＋珊瑚橘一抹重點色 */
    --navy:#4a3a28; --navy-deep:#332818;      /* 原深藍改深墨茶（標題與實色填底） */
    --gold:#c39140; --gold-soft:#e8d2a8;
    --copper:#1f8a9d; --copper-soft:#5fb3c2;  /* 宮古藍（珊瑚礁海的藍綠，全站重點色） */
    --grass:#5c8a5a;
    --ink:#26201a; --paper:#EDE4D3; --card:#fbf6ec;
    --line:#d9cbb2; --tip-bg:#e7dcc5;
    --red:#b04a3a; --warn-bg:#f6e3d3;
    /* 情境幕 token（沿用 ink-painterly-deck） */
    --paper-2:#E6DBC7; --paper-hi:#f6efe1;
    --sunset:#1f8a9d; --ocean:#cf7a5a; --ink-soft:#5a4c3c;
    --serif-en:'Didot','Bodoni 72','Cormorant Garamond',Georgia,serif;
    --t-slow:2.6s; --t-med:1.1s; --ease-ink:cubic-bezier(.22,1,.36,1);
  }
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
    font-family:"Noto Serif TC","Songti TC","STSong","PingFang TC",Georgia,serif;
    background:var(--paper);color:var(--ink);line-height:1.85;
    -webkit-font-smoothing:antialiased;
  }
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
@keyframes tickm{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.ink-cover{
    position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    text-align:center;padding:40px 28px 116px;
    background:linear-gradient(180deg,var(--paper-hi) 0%,var(--paper) 46%,var(--paper-2) 100%);
    border-bottom:1px solid var(--line);
  }
@keyframes clipInk{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.ink-cover .inner{position:relative;z-index:3}
.ink-cover .zh-side{position:absolute;left:18px;top:48%;z-index:3;writing-mode:vertical-rl;font-size:13px;letter-spacing:.4em;color:var(--sunset);opacity:.8}
.ink-cover .kicker{font-family:var(--serif-en);font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:var(--sunset)}
.ink-cover h1{font-weight:600;font-size:clamp(52px,13vw,84px);letter-spacing:.14em;line-height:1.06;margin:12px 0 6px;color:var(--ink);text-shadow:0 2px 20px rgba(246,239,225,.8)}
.ink-cover .en{font-family:var(--serif-en);font-size:15px;letter-spacing:.4em;color:var(--ink-soft);text-transform:uppercase}
.ink-cover .rule{width:40px;height:1px;background:var(--sunset);opacity:.8;margin:22px auto}
.ink-cover .dates{font-family:var(--serif-en);font-style:italic;font-size:16px;color:var(--ink)}
.ink-cover .who{font-size:12.5px;letter-spacing:.14em;color:var(--ink-soft);margin-top:6px}
.ink-cover .stamp{margin-top:14px;font-size:.72rem;opacity:.55;letter-spacing:.2em;color:var(--ink-soft)}
.ink-cover .dot{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:3;width:24px;height:24px;background:var(--sunset);border-radius:50%;opacity:.9}
.ink-cover .scrollcue{position:absolute;bottom:80px;left:0;right:0;z-index:3;font-size:11px;letter-spacing:.3em;color:var(--ink-soft);opacity:.6}
.rise{opacity:0;transform:translateY(22px);animation:rise 1.2s var(--ease-ink) forwards}
.rise.a{animation-delay:.6s}
.rise.b{animation-delay:.9s}
.rise.c{animation-delay:1.2s}
.rise.d{animation-delay:1.6s}
.rise.e{animation-delay:2s}
@keyframes rise{to{opacity:1;transform:none}}
.dot.rise{animation:rise 1.4s var(--ease-ink) 2.2s forwards}
.float-slow{animation:floaty 6s ease-in-out infinite 2.6s}
@keyframes floaty{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-9px)}}
.reveal{opacity:0;transform:translateY(24px);transition:opacity var(--t-med) var(--ease-ink),transform var(--t-med) var(--ease-ink)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.08s}
.reveal.d2{transition-delay:.2s}
.reveal.d3{transition-delay:.32s}
.reveal.d4{transition-delay:.44s}
@keyframes petalfall{
    from{transform:translateY(-30px) translateX(0) rotate(0)}
    to{transform:translateY(var(--fall)) translateX(var(--drift)) rotate(var(--spin))}}
#chnav{
    position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;
    background:rgba(237,228,211,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    transform:translateY(110%);transition:transform .7s var(--ease-ink);
  }
body.js-ch #chnav{display:block}
#chnav.show{transform:none}
#chnav .inner{display:flex;gap:6px;max-width:560px;margin:0 auto}
#chnav button{
    flex:1;appearance:none;background:transparent;border:1px solid transparent;border-radius:999px;
    font-family:inherit;padding:8px 2px;font-size:.85rem;letter-spacing:.06em;color:var(--navy);cursor:pointer;
    transition:background .4s var(--ease-ink),color .4s var(--ease-ink);
  }
#chnav button.active{background:var(--navy);color:#fff}
body.js-ch .chapter{display:none}
body.js-ch .chapter.on{display:block;animation:chIn .9s var(--ease-ink)}
@keyframes chIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
body.js-ch{padding-bottom:74px}
#ch-curtain{
    position:fixed;inset:0;z-index:90;pointer-events:none;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(60% 50% at 50% 42%,rgba(31,138,157,.10),transparent 70%),
      linear-gradient(105deg,var(--paper-hi),var(--paper) 55%,var(--paper-2));
    clip-path:inset(0 100% 0 0);
  }
#ch-curtain.cover{clip-path:inset(0 0 0 0);transition:clip-path .5s var(--ease-ink)}
#ch-curtain.cover.uncover{clip-path:inset(0 0 0 100%);transition:clip-path .6s var(--ease-ink)}
#ch-curtain .ct{font-size:30px;letter-spacing:.32em;color:var(--ink);opacity:.32;font-weight:600}
@media print{#chnav,#ch-curtain{display:none!important}
body.js-ch .chapter{display:block!important}}
section{padding:52px 0;border-bottom:1px solid var(--line)}
.sec-title{display:flex;align-items:center;gap:12px;font-size:1.65rem;color:var(--navy);
    letter-spacing:.06em;margin-bottom:6px;font-weight:700}
.sec-title::before{content:"";width:6px;height:1.5rem;flex:0 0 6px;
    background:linear-gradient(180deg,var(--copper),var(--gold));border-radius:3px}
.sec-sub{color:var(--gold);font-size:.92rem;letter-spacing:.08em;margin-bottom:24px}
.card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px 20px 16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(38,52,58,.05);
  }
.card h3{color:var(--navy);font-size:1.12rem;letter-spacing:.04em;margin-bottom:4px}
.card h3 .en{display:block;margin-top:3px;color:var(--gold);font-size:.8rem;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{
    font-size:.74rem;padding:2px 10px;border-radius:999px;letter-spacing:.05em;
    background:var(--tip-bg);color:var(--navy);border:1px solid var(--line);
  }
.chip.grade-S{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.grade-A{background:var(--gold-soft);color:var(--navy-deep);border-color:var(--gold)}
.chip.grade-B{background:#eee;color:#555}
.chip.warn{background:var(--warn-bg);color:var(--red);border-color:#e5c2b0}
.card p.desc{font-size:.98rem;margin:6px 0 4px;line-height:1.9}
.sec-title,.card h3{text-wrap:balance}
details summary{font-weight:600}
.kv{font-size:.88rem;margin:3px 0;color:#5a4c3c}
.kv b{color:var(--navy)}
.maps-btn{
    display:inline-block;margin-top:10px;padding:7px 18px;border-radius:999px;text-decoration:none;
    background:var(--navy);color:#fff;font-size:.84rem;letter-spacing:.08em;
  }
details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--copper);font-size:.86rem;letter-spacing:.05em;list-style:none}
summary::before{content:"▸ "}
details[open] summary::before{content:"▾ "}
details .inner-d{font-size:.88rem;padding:8px 2px;color:#5a4c3c}
@media (max-width:600px){
    .tl{margin-left:4px}
    .tl li{padding:8px 0 8px 16px;min-height:0;border-left:2px solid rgba(31,138,157,.28)}
    .tl li::before{
      position:static;display:block;width:auto;text-align:left;
      font-size:.8rem;font-weight:700;letter-spacing:.08em;
    }
    .tl li::after{left:-4px;top:17px;width:6px;height:6px;opacity:1}
  }
.tip{
    background:var(--tip-bg);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;
    padding:12px 16px;font-size:.9rem;margin:18px 0;color:#4a4335;
  }
.warn-box{
    background:var(--warn-bg);border-left:3px solid var(--red);border-radius:0 10px 10px 0;
    padding:12px 16px;font-size:.9rem;margin:18px 0;color:#6b3a2e;
  }
table{width:100%;border-collapse:collapse;font-size:.87rem;margin:12px 0}
th{background:var(--navy);color:#fff;padding:8px 10px;text-align:left;letter-spacing:.04em;font-weight:600}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:rgba(230,219,199,.45)}
.kv-hl{background:rgba(31,138,157,.08);border-left:3px solid var(--copper);padding:4px 10px;border-radius:0 8px 8px 0;font-weight:600;font-size:.95rem}
.gallery{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:6px;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;border-radius:8px}
.gallery img{height:150px;width:auto;border-radius:8px;flex:0 0 auto;scroll-snap-align:start;background:var(--tip-bg)}
.gallery.lg img{height:180px}
.gal-hint{font-size:.74rem;color:var(--ink-soft);opacity:.65;letter-spacing:.08em;text-align:center;margin-top:2px}
footer{padding:40px 0 60px;text-align:center;font-size:.78rem;color:#999;letter-spacing:.15em}
.footer-tag{margin-top:8px;letter-spacing:.4em;color:var(--gold);opacity:.55}

  .ink-cover{min-height:88vh}
  .ink-cover .hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;mix-blend-mode:multiply;filter:saturate(.8) contrast(.9)}
  .ink-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(237,228,211,.35) 0%,rgba(237,228,211,.15) 45%,rgba(237,228,211,.55) 100%);z-index:1}
  .ink-cover .inner{position:relative;z-index:2;text-align:center;padding:26px 22px 24px;background:rgba(251,246,236,.82);border:1px solid rgba(255,255,255,.7);border-radius:18px;margin:0 22px;backdrop-filter:blur(3px);box-shadow:0 6px 24px rgba(38,32,26,.12)}
  .ink-cover h1{font-size:clamp(2.3rem,8.5vw,3.4rem);line-height:1.25;color:var(--navy-deep);letter-spacing:.08em;margin:6px 0 10px}
  .ink-cover .kicker{font-family:var(--serif-en);font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:var(--ink-soft)}
  .ink-cover .en{font-family:var(--serif-en);font-size:15px;letter-spacing:.3em;color:var(--ink-soft);text-transform:uppercase}
  .ink-cover .rule{width:56px;height:1px;background:var(--copper);margin:18px auto}
  .ink-cover .dates,.ink-cover .who{font-size:.95rem;color:#4a3f30;letter-spacing:.06em;line-height:1.9}
  .ink-cover .scrollcue{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:.8rem;letter-spacing:.2em;color:var(--ink-soft);z-index:2}
  .wrap{padding-top:34px}

  .act{margin-top:30px;scroll-margin-top:12px}
  .act-head{margin:6px 0 16px;padding:16px 18px;border-radius:14px;background:linear-gradient(135deg,rgba(31,138,157,.10),rgba(31,138,157,.02));border:1px solid rgba(31,138,157,.25)}
  .act-head .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--copper);font-weight:700;letter-spacing:.04em}
  .act-head p{font-size:.94rem;color:#4a4335;margin-top:8px;line-height:1.85}
  .fit{padding:8px 12px;border-radius:0 8px 8px 0;border-left:3px solid;margin:8px 0 10px;font-size:.9rem;line-height:1.65}
  .fit.ok{background:rgba(92,138,90,.1);border-color:var(--grass);color:#3f6a3d}
  .fit.mid{background:var(--tip-bg);border-color:var(--gold);color:#6d5322}
  .fit.no{background:var(--warn-bg);border-color:var(--red);color:#8a3a2c}
  .pick-group{margin:22px 0 10px;display:flex;align-items:center;gap:10px;color:var(--copper);font-size:.8rem;letter-spacing:.14em;font-weight:700}
  .pick-group::after{content:"";flex:1;height:1px;background:var(--line)}
  .card h3 .en{color:#8a7d6b;letter-spacing:.04em;font-size:.78rem}
  .card .kv b{color:var(--navy)}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .btns .maps-btn{margin-top:6px}
  .maps-btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--navy)}
  .gallery img{cursor:zoom-in}
  .plan{list-style:none;margin:8px 0}
  .plan li{padding:10px 0;border-bottom:1px dashed var(--line);font-size:.95rem;line-height:1.75}
  .plan li b{color:var(--navy)}
  .plan li small{display:block;color:#8a7d6b;font-size:.8rem}
  .card .kv{font-size:.92rem;margin:6px 0;line-height:1.75}
  .card .kv.kv-hl{margin:10px 0;padding:8px 12px;font-size:.95rem}
  .menu{margin-top:12px;padding:12px 14px;background:var(--tip-bg);border-radius:10px;font-size:.9rem}
  .menu b{color:var(--navy)}
  .menu ul{margin:6px 0 0 18px}
  .menu li{margin:2px 0}

  #lb{position:fixed;inset:0;z-index:100;background:rgba(20,16,12,.94);display:none;align-items:center;justify-content:center;flex-direction:column}
  #lb.on{display:flex}
  #lb img{max-width:96vw;max-height:80vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.6);object-fit:contain;background:#000}
  #lb .cap{color:#e8dcc5;font-size:.86rem;letter-spacing:.06em;margin-top:12px;text-align:center;padding:0 20px}
  #lb .x{position:absolute;top:14px;right:16px;color:#fff;font-size:30px;line-height:1;background:transparent;border:none;cursor:pointer;padding:8px;font-family:inherit}
  #lb .nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:34px;background:rgba(255,255,255,.08);border:none;border-radius:50%;width:48px;height:48px;cursor:pointer;font-family:inherit}
  #lb .prev{left:8px} #lb .next{right:8px}
</style>
</head>
<body>

<section class="ink-cover" id="cover">
  <img class="hero" src="img/hero.jpg" alt="宮古島珊瑚礁海域">
  <div class="inner">
    <div class="kicker rise a">Miyakojima · Family Sea Days</div>
    <h1 class="rise b">宮古島<br>親子海上活動</h1>
    <div class="en rise b">Kids 4 &amp; 6 · Ocean Activities</div>
    <div class="rule rise c"></div>
    <div class="dates rise c">9/25–9/28・9 大 2 小（4 歲、6 歲）</div>
    <div class="who rise d">半潛式觀光船・透明獨木舟・海龜浮潛・中之島浮潛・雙體船出海</div>
  </div>
  <div class="scrollcue rise e">向下捲動 ⌄</div>
</section>

<div class="wrap">
  <div id="summary"></div>
  <div id="acts"></div>
</div>

<footer>
  <div class="footer-tag">MIYAKOJIMA · FAMILY SEA DAYS</div>
  <div style="font-size:.74rem;color:#8a7d6b;letter-spacing:.06em;margin-top:8px">資料查證日 2026-09-16・價格與時間以業者為準・新台幣以 1 日圓 ≈ 0.205 換算・照片取自業者官網、預約平台與 Google Maps</div>
</footer>

<script>
(function(){

  var $=function(id){ return document.getElementById(id); };
  var esc=function(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); };

  }

    '</div>';
  }
